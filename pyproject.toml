[project]
name = "gpex"
version = "0.1.0.dev0"
description = "Gaussian processes for experimental design in JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander von Rohr", email = "alex@bgoode.de" },
]
requires-python = ">=3.12"
keywords = [
    "gaussian-processes",
    "jax",
    "linear-functionals",
    "probabilistic-machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cholops>=0.2.1",
    "equinox>=0.12",
    "jax==0.11.2",
    "jaxtyping>=0.3",
    "numpy>=1.26",
    "optax>=0.2",
    "plum-dispatch>=2.10.1,<3",
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]==0.11.2; sys_platform == 'linux'",
]
examples = [
    "jupyterlab>=4",
    "matplotlib>=3.10",
]

[project.urls]
Documentation = "https://avrohr.github.io/gpex/"
Issues = "https://github.com/avrohr/gpex/issues"
Repository = "https://github.com/avrohr/gpex"

[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gpex"
source-exclude = [".DS_Store"]

[tool.uv.sources]
# GPJax 1.0.0 caps JAX below 0.11. Pin upstream's removal until it is released.
gpjax = { git = "https://github.com/QuantClimate/GPJax", rev = "964bad77483e3c694f116d666d21617a1260208b" }

[dependency-groups]
build = [
    "build>=1.2",
    "twine>=6",
]
comparison = [
    "gpjax==1.0.0",
    "gpytorch==1.15.2",
    "torch==2.14.0",
]
docs = [
    "mike>=2.1",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]
dev = [
    { include-group = "build" },
    { include-group = "docs" },
    "jupyterlab>=4",
    "matplotlib>=3.10",
    "nbconvert>=7",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gpex"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["old", "docs/tutorials/*.ipynb"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
exclude = ["old"]
include = ["src", "tests", "examples", "benchmarks"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
